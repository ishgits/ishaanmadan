name: Site checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  production-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
  live-site:
    name: Current public site
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check homepage response
        run: |
          curl --fail --show-error --silent --location --retry 2 --max-time 30 'https://ishaanmadan.org/?health=github-${{ github.run_id }}' -o /tmp/home.html
          node -e "const html=require('node:fs').readFileSync('/tmp/home.html','utf8'); if(!html.includes('<h1') || html.includes('TypeError: Invalid header value.')) { console.error(html.slice(0,2000)); process.exit(1); } console.log('Public homepage contains the expected HTML heading.');"
