<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <link rel="canonical" href="https://ishaanmadan.org/">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=https://ishaanmadan.org/">
  <script>
    (function () {
      var base = "/ishaanmadan";
      var path = window.location.pathname;
      if (path.indexOf(base) === 0) { path = path.slice(base.length); }
      if (path === "") { path = "/"; }
      window.location.replace(
        "https://ishaanmadan.org" + path + window.location.search + window.location.hash
      );
    })();
  </script>
</head>
<body>
  Redirecting to <a href="https://ishaanmadan.org/">https://ishaanmadan.org/</a>
</body>
</html>
